// Media3 (ExoPlayer) for the player and preview clips (player.android.tsx, clip.android.ts): direct
// files and the server's HLS (fMP4) streams.
dependencies {
  def media3 = "1.5.1"
  implementation "androidx.media3:media3-exoplayer:$media3"
  implementation "androidx.media3:media3-exoplayer-hls:$media3"
  implementation "androidx.media3:media3-ui:$media3"
  // The lock screen and notification's controls (nowPlaying.android.ts).
  implementation "androidx.media3:media3-session:$media3"
  // "Ready to watch" checks in the background (notifications.android.ts).
  implementation "androidx.work:work-runtime:2.9.1"
  // Casting to a Chromecast (cast.android.ts).
  implementation "com.google.android.gms:play-services-cast-framework:21.5.0"
}

android {
  compileSdkVersion 35
  buildToolsVersion "35.0.0"
  // ndkVersion ""

  defaultConfig {
    minSdkVersion 24
    targetSdkVersion 35

    // Version Information
    versionCode 1
    versionName "1.0.0"
    
    generatedDensities = []
  }

  aaptOptions {
    additionalParameters "--no-version-vectors"
  }
}
