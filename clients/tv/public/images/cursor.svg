<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 32 32">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#2f6fed"/>
    </linearGradient>
  </defs>
  <!-- A drop leaning up-left: near-vertical left edge, round body. The tip (5,3.5) clicks. -->
  <path filter="url(#shadow)" d="M5 3.5 L20.02 8.58 A11 11 0 1 1 5.51 19.35 Z"
        fill="url(#fill)" stroke="#ffffff" stroke-width="2.8" stroke-linejoin="round"/>
</svg>
